<div class="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-md p-4 sm:p-6 overflow-y-auto" (click)="close()">
      <div class="relative my-auto w-full max-w-md bg-surface-900 border border-surface-700/80 rounded-2xl p-6 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.85)] animate-scale-in text-left max-h-[calc(100vh-3.5rem)] overflow-y-auto" (click)="$event.stopPropagation()">
        
        <div class="flex justify-between items-center mb-6">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-primary-600 to-neutral-500 flex items-center justify-center text-sm shadow">
              <span class="material-symbols-outlined align-middle">credit_card</span>
            </div>
            <h2 class="text-lg font-bold text-surface-100">Secure Checkout</h2>
          </div>
          <button (click)="close()" [disabled]="processing()" class="text-surface-200 hover:text-surface-100 disabled:opacity-50 text-lg p-1 leading-none" title="Close"><span class="material-symbols-outlined text-xl align-middle">close</span></button>
        </div>

        <div class="bg-surface-950 p-4 rounded-xl border border-surface-800 mb-6 flex justify-between items-center">
          <span class="text-surface-200 text-sm font-medium">Total Amount Due</span>
          <span class="text-2xl font-bold font-mono text-primary-600">₹{{ formatCurrency(amount) }}</span>
        </div>

        <div class="space-y-4">
          <div>
            <label class="label text-xs">Card Number</label>
            <div class="relative">
              <input type="text" class="input-field pl-10 font-mono tracking-widest text-sm" placeholder="0000 0000 0000 0000" maxlength="19" [disabled]="processing()">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-surface-500 text-lg"><span class="material-symbols-outlined align-middle">credit_card</span></span>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="label text-xs">Expiry Date</label>
              <input type="text" class="input-field font-mono text-center text-sm" placeholder="MM/YY" maxlength="5" [disabled]="processing()">
            </div>
            <div>
              <label class="label text-xs">CVC / CVV</label>
              <div class="relative">
                <input type="password" class="input-field font-mono text-center text-sm" placeholder="•••" maxlength="4" [disabled]="processing()">
                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-surface-500 text-xs text-info-400 cursor-help" title="3 digits on back of card">️</span>
              </div>
            </div>
          </div>
          <div>
            <label class="label text-xs">Cardholder Name</label>
            <input type="text" class="input-field text-sm" placeholder="Name on card" [disabled]="processing()">
          </div>
        </div>

        <button (click)="process()" [disabled]="processing()" class="btn-primary w-full mt-8 py-3 text-sm shadow-lg flex justify-center items-center gap-2">
          @if (processing()) {
            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Processing Payment...
          } @else {
            <span class="material-symbols-outlined align-middle">lock</span> Pay ₹{{ formatCurrency(amount) }} Securely
          }
        </button>

        <p class="text-center text-[10px] text-surface-500 mt-4 flex items-center justify-center gap-1">
          <span><span class="material-symbols-outlined align-middle">lock</span></span> Payments are processed securely via MockGateway
        </p>
      </div>
    </div>
