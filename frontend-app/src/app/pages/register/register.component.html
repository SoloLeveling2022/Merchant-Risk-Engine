<div class="min-h-screen flex items-center justify-center bg-surface-950 px-4 py-12">
  <div class="w-full max-w-lg">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-primary-500/10 border border-primary-500/20 text-primary-400 mb-4">
        <span class="material-symbols-outlined text-3xl">storefront</span>
      </div>
      <h1 class="text-2xl font-bold text-surface-100">Merchant Onboarding</h1>
      <p class="text-sm text-surface-200 mt-1">Register Entity for Risk Assessment & Rolling Reserve Escrow</p>
    </div>

    <!-- Card -->
    <div class="card p-8 border border-surface-800 bg-surface-900/80 backdrop-blur-sm rounded-2xl shadow-2xl">
      <h2 class="text-lg font-semibold text-surface-100 mb-6">Create Merchant Account</h2>

      @if (error()) {
        <div class="mb-4 p-3 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs flex items-center gap-2">
          <span class="material-symbols-outlined text-base">error</span>
          <span>{{ error() }}</span>
        </div>
      }

      <form [formGroup]="registerForm" (ngSubmit)="onRegister()" class="space-y-4">
        <div>
          <label class="block text-xs font-mono uppercase text-surface-200 mb-1.5">Legal Business Name</label>
          <input type="text" formControlName="businessName" placeholder="Acme Global Technologies Inc."
                 class="w-full bg-surface-950 border border-surface-800 rounded-xl px-4 py-2.5 text-sm text-surface-100 focus:outline-none focus:border-primary-500 transition-colors" />
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-mono uppercase text-surface-200 mb-1.5">Merchant Category Code (MCC)</label>
            <select formControlName="mcc"
                    class="w-full bg-surface-950 border border-surface-800 rounded-xl px-4 py-2.5 text-sm text-surface-100 focus:outline-none focus:border-primary-500 transition-colors">
              <option value="5734">5734 - Software & SaaS</option>
              <option value="5817">5817 - Digital Goods</option>
              <option value="7995">7995 - Gaming / High Risk</option>
              <option value="5999">5999 - Retail & E-commerce</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-mono uppercase text-surface-200 mb-1.5">Descriptor Prefix (6 chars)</label>
            <input type="text" formControlName="billingDescriptorPrefix" maxlength="6" placeholder="ACMECO"
                   class="w-full bg-surface-950 border border-surface-800 rounded-xl px-4 py-2.5 text-sm text-surface-100 focus:outline-none focus:border-primary-500 uppercase font-mono transition-colors" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-mono uppercase text-surface-200 mb-1.5">Corporate Email Address</label>
          <input type="email" formControlName="email" placeholder="owner@acme-corp.com"
                 class="w-full bg-surface-950 border border-surface-800 rounded-xl px-4 py-2.5 text-sm text-surface-100 focus:outline-none focus:border-primary-500 transition-colors" />
        </div>

        <div>
          <label class="block text-xs font-mono uppercase text-surface-200 mb-1.5">Password</label>
          <input type="password" formControlName="password" placeholder="••••••••"
                 class="w-full bg-surface-950 border border-surface-800 rounded-xl px-4 py-2.5 text-sm text-surface-100 focus:outline-none focus:border-primary-500 transition-colors" />
        </div>

        <button type="submit" [disabled]="loading()"
                class="w-full btn-primary py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 mt-2">
          @if (loading()) {
            <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
          }
          <span>{{ loading() ? 'Onboarding Merchant...' : 'Complete Registration' }}</span>
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-surface-200 text-sm">
          Already registered?
          <a routerLink="/auth/login" class="text-primary-400 hover:text-primary-300 font-medium">Sign In</a>
        </p>
      </div>
    </div>
  </div>
</div>
