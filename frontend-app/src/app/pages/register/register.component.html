<div class="min-h-screen flex items-center justify-center bg-surface-950 px-4 py-12 relative overflow-hidden">
  <!-- Soft ambient background vignette gradient -->
  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-4xl h-[500px] bg-gradient-to-b from-primary-100/40 via-frost-200/20 to-transparent blur-3xl pointer-events-none"></div>

  <div class="w-full max-w-lg relative z-10">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-3xl bg-surface-800 border border-surface-700/80 text-primary-800 mb-4 shadow-pill">
        <span class="material-symbols-outlined text-3xl">storefront</span>
      </div>
      <h1 class="text-2xl font-extrabold text-surface-100 tracking-tight font-display">Merchant Onboarding</h1>
      <p class="text-sm text-surface-300 mt-1">Register Entity for Risk Assessment &amp; Rolling Reserve Escrow</p>
    </div>

    <!-- Card -->
    <div class="card p-8 md:p-9 border border-surface-700 bg-white rounded-4xl shadow-card">
      <h2 class="text-lg font-bold text-surface-100 mb-6 font-display">Create Merchant Account</h2>

      @if (error()) {
        <div class="mb-5 p-3.5 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 text-xs flex items-center gap-2.5">
          <span class="material-symbols-outlined text-base">error</span>
          <span>{{ error() }}</span>
        </div>
      }

      <form [formGroup]="registerForm" (ngSubmit)="onRegister()" class="space-y-4">
        <div>
          <label class="block text-xs font-mono uppercase text-surface-400 font-semibold mb-1.5">Legal Business Name</label>
          <input type="text" formControlName="businessName" placeholder="Acme Global Technologies Inc."
                 class="w-full bg-white border border-surface-700 rounded-2xl px-4 py-3 text-sm text-surface-100 placeholder:text-surface-400 focus:outline-none focus:border-primary-700 focus:ring-2 focus:ring-primary-200/50 transition-all shadow-sm" />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-mono uppercase text-surface-400 font-semibold mb-1.5">Merchant Category (MCC)</label>
            <select formControlName="mcc"
                    class="w-full bg-white border border-surface-700 rounded-2xl px-4 py-3 text-sm text-surface-100 focus:outline-none focus:border-primary-700 focus:ring-2 focus:ring-primary-200/50 transition-all shadow-sm">
              <option value="5734">5734 - Software &amp; SaaS</option>
              <option value="5817">5817 - Digital Goods</option>
              <option value="7995">7995 - Gaming / High Risk</option>
              <option value="5999">5999 - Retail &amp; E-commerce</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-mono uppercase text-surface-400 font-semibold mb-1.5">Descriptor Prefix (6 chars)</label>
            <input type="text" formControlName="billingDescriptorPrefix" maxlength="6" placeholder="ACMECO"
                   class="w-full bg-white border border-surface-700 rounded-2xl px-4 py-3 text-sm text-surface-100 placeholder:text-surface-400 focus:outline-none focus:border-primary-700 focus:ring-2 focus:ring-primary-200/50 uppercase font-mono transition-all shadow-sm" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-mono uppercase text-surface-400 font-semibold mb-1.5">Corporate Email Address</label>
          <input type="email" formControlName="email" placeholder="owner@acme-corp.com"
                 class="w-full bg-white border border-surface-700 rounded-2xl px-4 py-3 text-sm text-surface-100 placeholder:text-surface-400 focus:outline-none focus:border-primary-700 focus:ring-2 focus:ring-primary-200/50 transition-all shadow-sm" />
        </div>

        <div>
          <label class="block text-xs font-mono uppercase text-surface-400 font-semibold mb-1.5">Password</label>
          <input type="password" formControlName="password" placeholder="••••••••"
                 class="w-full bg-white border border-surface-700 rounded-2xl px-4 py-3 text-sm text-surface-100 placeholder:text-surface-400 focus:outline-none focus:border-primary-700 focus:ring-2 focus:ring-primary-200/50 transition-all shadow-sm" />
        </div>

        <button type="submit" [disabled]="loading()"
                class="w-full btn-primary py-3.5 rounded-2xl font-semibold text-sm flex items-center justify-center gap-2 mt-2 shadow-dusk">
          @if (loading()) {
            <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
          }
          <span>{{ loading() ? 'Onboarding Merchant...' : 'Complete Registration' }}</span>
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-surface-300 text-sm">
          Already registered?
          <a routerLink="/auth/login" class="text-primary-800 hover:text-primary-900 font-bold ml-1">Sign In</a>
        </p>
      </div>
    </div>
  </div>
</div>
