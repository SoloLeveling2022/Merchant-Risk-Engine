<div class="min-h-screen flex items-center justify-center bg-surface-950 px-4 py-12">
  <div class="w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-primary-500/10 border border-primary-500/20 text-primary-400 mb-4">
        <span class="material-symbols-outlined text-3xl">shield</span>
      </div>
      <h1 class="text-2xl font-bold text-surface-100">Merchant Risk Engine</h1>
      <p class="text-sm text-surface-200 mt-1">Rolling Reserve & Dispute Settlement Platform</p>
    </div>

    <!-- Card -->
    <div class="card p-8 border border-surface-800 bg-surface-900/80 backdrop-blur-sm rounded-2xl shadow-2xl">
      <h2 class="text-lg font-semibold text-surface-100 mb-6">Sign In to Platform</h2>

      @if (error()) {
        <div class="mb-4 p-3 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs flex items-center gap-2">
          <span class="material-symbols-outlined text-base">error</span>
          <span>{{ error() }}</span>
        </div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="space-y-4">
        <div>
          <label class="block text-xs font-mono uppercase text-surface-200 mb-1.5">Email Address</label>
          <input type="email" formControlName="email" placeholder="merchant@acme-corp.com"
                 class="w-full bg-surface-950 border border-surface-800 rounded-xl px-4 py-2.5 text-sm text-surface-100 focus:outline-none focus:border-primary-500 transition-colors" />
        </div>

        <div>
          <label class="block text-xs font-mono uppercase text-surface-200 mb-1.5">Password</label>
          <input type="password" formControlName="password" placeholder="••••••••"
                 class="w-full bg-surface-950 border border-surface-800 rounded-xl px-4 py-2.5 text-sm text-surface-100 focus:outline-none focus:border-primary-500 transition-colors" />
        </div>

        <button type="submit" [disabled]="loading()"
                class="w-full btn-primary py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 mt-2">
          @if (loading()) {
            <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
          }
          <span>{{ loading() ? 'Signing in...' : 'Sign In' }}</span>
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-surface-200 text-sm">
          New Merchant?
          <a routerLink="/auth/register" class="text-primary-400 hover:text-primary-300 font-medium">Register for KYB</a>
        </p>
      </div>

      <!-- Quick Demo Login -->
      <div class="mt-6 pt-5 border-t border-surface-800">
        <p class="text-xs text-surface-200 mb-3 text-center font-mono">Quick Demo Sign-In</p>
        <div class="grid grid-cols-2 gap-2">
          <button (click)="quickLogin('merchant@acme-corp.com', 'password', 'ROLE_MERCHANT_OWNER')"
                  class="btn-secondary text-xs py-2 flex items-center justify-center gap-1.5">
            <span class="material-symbols-outlined text-sm text-emerald-400">storefront</span>
            <span>Merchant Owner</span>
          </button>
          <button (click)="quickLogin('finance@acme-corp.com', 'password', 'ROLE_MERCHANT_FINANCE')"
                  class="btn-secondary text-xs py-2 flex items-center justify-center gap-1.5">
            <span class="material-symbols-outlined text-sm text-sky-400">account_balance</span>
            <span>Merchant Finance</span>
          </button>
          <button (click)="quickLogin('analyst@riskops.com', 'password', 'ROLE_RISK_ANALYST')"
                  class="btn-secondary text-xs py-2 flex items-center justify-center gap-1.5">
            <span class="material-symbols-outlined text-sm text-amber-400">radar</span>
            <span>Risk Analyst</span>
          </button>
          <button (click)="quickLogin('admin@riskops.com', 'password', 'ROLE_RISK_ADMIN')"
                  class="btn-secondary text-xs py-2 flex items-center justify-center gap-1.5">
            <span class="material-symbols-outlined text-sm text-rose-400">admin_panel_settings</span>
            <span>Risk Admin</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
