server:
  port: 8081

spring:
  application:
    name: merchant-velocity-service
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/merchantrisk
    username: postgres
    password: password
    pool:
      initial-size: 10
      max-size: 30
      max-idle-time: 30m
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      underwritingService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  retry:
    instances:
      underwritingService:
        max-attempts: 3
        wait-duration: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
