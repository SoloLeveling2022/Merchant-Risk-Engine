server:
  port: 9070

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        # Auth Service
        - id: auth-service
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0

        # Portfolio Service
        - id: portfolio-service
          uri: lb://portfolio-market-service
          predicates:
            - Path=/api/v1/portfolios/**
          filters:
            - StripPrefix=0

        # Insurance Core Service
        - id: insurance-core-service
          uri: lb://insurance-core-service
          predicates:
            - Path=/api/v1/underwriting/**,/api/v1/policies/**,/api/v1/endorsements/**
          filters:
            - StripPrefix=0

        # Claims & Finance Service
        - id: claims-finance-service
          uri: lb://claims-finance-service
          predicates:
            - Path=/api/v1/claims/**,/api/v1/payments/**
          filters:
            - StripPrefix=0

        # Platform Ops / Audit Service
        - id: platform-ops-service
          uri: lb://platform-ops-service
          predicates:
            - Path=/api/v1/audit/**,/api/notifications/**
          filters:
            - StripPrefix=0

app:
  jwt:
    secret: ${JWT_SECRET:MyVerySecureJWTSecretKeyForStockInsurancePlatform2027}
    expiry-ms: 3600000

  public-paths: /api/v1/auth/register,/api/v1/auth/login,/api/v1/auth/refresh,/api/v1/auth/seed-users,/actuator/health,/actuator/info,/api/v1/auth/users,/api/v1/portfolios/,/api/v1/policies/,/api/v1/claims/,/api/v1/underwriting/,/api/notifications/,/api/v1/notifications/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.hasnika.insurance: DEBUG
    org.springframework.cloud.gateway: INFO

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true
