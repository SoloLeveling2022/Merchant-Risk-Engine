server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          trusted-proxies: "^10\\..*|^172\\.(1[6-9]|2[0-9]|3[0-1])\\..*|^192\\.168\\..*|^127\\.0\\.0\\.1$"
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        - id: merchant-identity-route
          uri: lb://MERCHANT-IDENTITY-SERVICE
          predicates:
            - Path=/api/v1/auth/**, /api/v1/merchants/**, /.well-known/jwks.json

        - id: merchant-velocity-route
          uri: lb://MERCHANT-VELOCITY-SERVICE
          predicates:
            - Path=/api/v1/velocity/**
          metadata:
            response-timeout: -1

        - id: reserve-underwriting-route
          uri: lb://RESERVE-UNDERWRITING-SERVICE
          predicates:
            - Path=/api/v1/underwriting/**
          metadata:
            response-timeout: -1

        - id: dispute-settlement-route
          uri: lb://DISPUTE-SETTLEMENT-SERVICE
          predicates:
            - Path=/api/v1/disputes/**, /api/v1/ledger/**

        - id: platform-ops-route
          uri: lb://PLATFORM-OPS-SERVICE
          predicates:
            - Path=/api/v1/ops/**
          metadata:
            response-timeout: -1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,prometheus
