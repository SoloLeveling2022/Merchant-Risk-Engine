server:
  port: 8083

spring:
  application:
    name: dispute-settlement-service
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/merchantrisk
    username: postgres
    password: password
    pool:
      initial-size: 10
      max-size: 30
      max-idle-time: 30m
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
