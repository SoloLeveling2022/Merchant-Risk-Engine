server:
  port: 9081

spring:
  application:
    name: identity-service
  r2dbc:
    url: r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:stock_insurance_db}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:mysql}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
  flyway:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:MyVerySecureJWTSecretKeyForStockInsurancePlatform2027}
    expiry-ms: 3600000
    refresh-expiry-ms: 604800000
    issuer: stock-insurance-platform

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.hasnika.insurance: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true
